<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>TRIA</title>
</head>
<body>
     <header class="cabecalho">
        <h2>TRIA</h2>
    </header>
    <div class="container">
        <header>
            <h1>Criar minha conta</h1>
            <p>
            Suas informações ajudam o TRIA a encontrar unidades perto de você.
            </p>
        </header>

        <form>
             <div class="campo">
                <label>Nome completo</label>
                <input type="text" >
            </div>

             <div class="campo" >
                <label>CPF</label>
                <input type="text" placeholder="XXX-XXX-XXX-XX">
            </div>

             <div class="campo">
                <label>Telefone</label>
                <input type="text" placeholder="(81)9 9999-9999">
            </div>

             <div class="campo">
                <label>CEP</label>
                <input type="text" placeholder="00000-000">
            </div>

             <div class="campo">
                <label>Senha</label>
                <input type="password" placeholder="Crie uma senha para acessar">
            </div>


        </form>

        <a href="dashtela.html"> <button class="btn-principal">Criar minha conta</button> </a>
        <button class="btn-voltar">Voltar ao inicio</button>

        <div class="aviso-msg">
            Seus dados serão utilizados apenas dentro do TRIA
        </div>

    </div>
</body>
</html>
